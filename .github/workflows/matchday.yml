name: Matchday report

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  matchday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild matchday.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/football.py matchday
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub caches README images by URL, so change the URL on every rebuild
          sed -i -E "s#assets/matchday.svg(\?v=[0-9]+)?#assets/matchday.svg?v=$(date +%s)#" README.md
          git add assets/matchday.svg README.md
          git diff --cached --quiet || git commit -m "⚽ matchday: refresh report"
          git pull --rebase
          git push
